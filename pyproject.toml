[project]
name = "claude-self-improvement"
version = "0.1.0"
description = "Hook-driven experiential learning plugin for Claude Code."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

# Intentionally and permanently empty. Plugin runtime code imports the standard
# library only, because hook scripts run inside Claude Code's environment on a
# five-second budget and must fail open; a third-party import there would need a
# bootstrap step in the code that has to be most reliable. See spec section 4.1.
# tests/unit/test_no_runtime_deps.py enforces this.
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin", "."]
filterwarnings = ["error"]
markers = [
    "smoke: drives a real Claude Code session and spends model usage; excluded from `make test` and run by `make smoke`",
    "interactive: needs a person at the terminal; skipped with SMOKE_SKIP_INTERACTIVE=1",
    "pty: drives a real session on a pseudo-terminal to observe the asynchronous wake; spends model usage and is excluded from every other target (see `make wake`)",
    "harness: self-checks the pty harness against a fake terminal, not the plugin; no model, no cost, and it runs in `make test` like any other test (see `make test-harness`)",
    "auto_memory: drives a session with Claude Code's own auto memory left on, to observe how the two learning systems interact; a third live session, so it is excluded from `make wake` and run by `make wake-memory`",
]
